name: Build Three.js Test 05W

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-05w-src/**'
      - 'labs/threejs-melee-micro-impact-proof/acceptance.json'
      - 'labs/threejs-test-05v/build-info.json'
      - '.github/workflows/build-threejs-test05w.yml'

permissions:
  contents: write

concurrency:
  group: threejs-test05w-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: labs/threejs-test-05w-src
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Build 05W
        working-directory: labs/threejs-test-05w-src
        run: npm run build
      - name: Verify 05W
        run: |
          test -f labs/threejs-test-05w/index.html
          test -f labs/threejs-test-05w/app.js
          test -f labs/threejs-test-05w/build-info.json
          test -f labs/threejs-test-05w/verification-report.json
          test -f labs/threejs-test-05w/assets/Soldier.glb
          grep -q '05W — AVERAGE MELEE MICRO KNOCKBACK' labs/threejs-test-05w/index.html
          grep -q '"distance_m": 0.07' labs/threejs-test-05w/build-info.json
          grep -q '"persistent_world_displacement": true' labs/threejs-test-05w/build-info.json
          grep -q '"affects_future_reach_checks": true' labs/threejs-test-05w/build-info.json
          grep -q '"status": "PASS"' labs/threejs-test-05w/verification-report.json
          grep -q '"accepted_25_40_constants_changed": false' labs/threejs-test-05w/build-info.json
          ! test -f labs/threejs-test-05w/sw.js
      - name: Publish 05W
        run: |
          git config user.name 'raaioperations-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/threejs-test-05w
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build Three.js Test 05W micro knockback'
          git push origin HEAD:main
