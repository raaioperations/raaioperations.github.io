name: Build Three.js Test 05O

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-05o-src/**'
      - '.github/workflows/build-threejs-test05o.yml'

permissions:
  contents: write

concurrency:
  group: threejs-test05o-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned build dependencies
        working-directory: labs/threejs-test-05o-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build enemy active damage proof
        working-directory: labs/threejs-test-05o-src
        run: npm run build

      - name: Verify proof outputs
        run: |
          test -f labs/threejs-test-05o/index.html
          test -f labs/threejs-test-05o/app.js
          test -f labs/threejs-test-05o/assets/Soldier.glb
          test -f labs/threejs-test-05o/sw.js
          test -f labs/threejs-test-05o/build-info.json
          ! grep -Eqi 'cdn\.jsdelivr|unpkg\.com|esm\.sh' labs/threejs-test-05o/index.html labs/threejs-test-05o/app.js labs/threejs-test-05o/sw.js
          grep -q 'ENEMY DAMAGE TELEGRAPH ZERO' labs/threejs-test-05o/app.js
          grep -q 'ENEMY DAMAGE ACTIVE CONFIRMED' labs/threejs-test-05o/app.js
          grep -q 'ENEMY DAMAGE EXACT' labs/threejs-test-05o/app.js
          grep -q 'ENEMY DAMAGE NEW CYCLE' labs/threejs-test-05o/app.js
          grep -q 'enemyDamageCheck5' labs/threejs-test-05o/index.html
          grep -q 'RUN DAMAGE CYCLE' labs/threejs-test-05o/index.html

      - name: Publish built proof to main
        run: |
          git config user.name 'raaioperations-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/threejs-test-05o
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Build Three.js Test 05O enemy active damage proof'
          git push origin HEAD:main
