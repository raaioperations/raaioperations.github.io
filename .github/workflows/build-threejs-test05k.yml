name: Build Three.js Test 05K

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-05k-src/**'
      - '.github/workflows/build-threejs-test05k.yml'

permissions:
  contents: write

concurrency:
  group: threejs-test05k-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned build dependencies
        working-directory: labs/threejs-test-05k-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build parry enemy stagger proof
        working-directory: labs/threejs-test-05k-src
        run: npm run build

      - name: Verify proof outputs
        run: |
          test -f labs/threejs-test-05k/index.html
          test -f labs/threejs-test-05k/app.js
          test -f labs/threejs-test-05k/assets/Soldier.glb
          test -f labs/threejs-test-05k/sw.js
          test -f labs/threejs-test-05k/build-info.json
          ! grep -Eqi 'cdn\.jsdelivr|unpkg\.com|esm\.sh' labs/threejs-test-05k/index.html labs/threejs-test-05k/app.js labs/threejs-test-05k/sw.js
          grep -q 'STAGGER ENTERED' labs/threejs-test-05k/app.js
          grep -q 'STAGGER ACTION BLOCKED' labs/threejs-test-05k/app.js
          grep -q 'STAGGER ACTION RESTORED' labs/threejs-test-05k/app.js
          grep -q 'Test 05K checklist' labs/threejs-test-05k/index.html
          grep -q 'staggerCheck6' labs/threejs-test-05k/index.html

      - name: Publish built proof to main
        run: |
          git config user.name 'raaioperations-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/threejs-test-05k
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Build Three.js Test 05K parry enemy stagger proof'
          git push origin HEAD:main
