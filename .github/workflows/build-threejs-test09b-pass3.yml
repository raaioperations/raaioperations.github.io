name: Build Three.js Test 09B Pass 3

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-09b-pass3-src/**'
      - '.github/workflows/build-threejs-test09b-pass3.yml'
      - 'labs/threejs-test-09d/acceptance.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        working-directory: labs/threejs-test-09b-pass3-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build 09B Pass 3
        working-directory: labs/threejs-test-09b-pass3-src
        run: npm run build

      - name: Verify Pass 3
        run: |
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('labs/threejs-test-09b/verification-report.json','utf8')); if(v.status!=='PASS'||v.iteration!=='Presentation Pass 3') process.exit(1); console.log(v);"

      - name: Publish 09B Pass 3
        run: |
          git config user.name "raaioperations"
          git config user.email "alanhasan87@gmail.com"
          git add labs/threejs-test-09b
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build 09B asset-integrated Presentation Pass 3"
            git push
          fi
