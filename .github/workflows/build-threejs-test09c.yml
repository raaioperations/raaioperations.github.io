name: Build Three.js Test 09C

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-09c-src/**'
      - '.github/workflows/build-threejs-test09c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset-generation dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy trimesh

      - name: Prove deterministic asset generation
        run: |
          rm -rf /tmp/09c-a /tmp/09c-b
          ASSET_OUT=/tmp/09c-a python labs/threejs-test-09c-src/generate_assets.py >/tmp/09c-a.log
          ASSET_OUT=/tmp/09c-b python labs/threejs-test-09c-src/generate_assets.py >/tmp/09c-b.log
          (cd /tmp/09c-a && sha256sum *.glb | sort) >/tmp/09c-a.sha
          (cd /tmp/09c-b && sha256sum *.glb | sort) >/tmp/09c-b.sha
          diff -u /tmp/09c-a.sha /tmp/09c-b.sha

      - name: Generate production GLB kit
        run: |
          rm -rf assets/3d/sunlit-basin/v1
          ASSET_OUT=assets/3d/sunlit-basin/v1 python labs/threejs-test-09c-src/generate_assets.py

      - name: Verify production GLBs
        run: |
          python labs/threejs-test-09c-src/verify_assets.py             --assets assets/3d/sunlit-basin/v1             --report labs/threejs-test-09c/verification-report.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install gallery dependencies
        working-directory: labs/threejs-test-09c-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build asset review gallery
        working-directory: labs/threejs-test-09c-src
        run: npm run build-gallery

      - name: Verify gallery output
        run: |
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('labs/threejs-test-09c/verification-report.json','utf8')); const b=JSON.parse(fs.readFileSync('labs/threejs-test-09c/build-info.json','utf8')); if(v.status!=='PASS'||b.asset_count!==13) process.exit(1); console.log({status:v.status,assets:b.asset_count});"

      - name: Publish 09C assets and gallery
        run: |
          git config user.name "raaioperations"
          git config user.email "alanhasan87@gmail.com"
          git add assets/3d/sunlit-basin/v1 labs/threejs-test-09c
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build Test 09C Sunlit Basin production asset kit"
            git push
          fi
