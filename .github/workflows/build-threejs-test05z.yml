name: Build Three.js Test 05Z

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-05z-src/**'
      - 'labs/threejs-test-05y/acceptance.json'
      - '.github/workflows/build-threejs-test05z.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build 05Z
        working-directory: labs/threejs-test-05z-src
        run: npm run build
      - name: Verify 05Z
        run: |
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('labs/threejs-test-05z/verification-report.json','utf8'));if(r.status!=='PASS')process.exit(1);"
          grep -q '05Z_DEFAULT_MELEE_IMPACT' labs/threejs-test-05z/app.js
          grep -q '05R_V2_SOURCE_CAMERA_JOLT' labs/threejs-test-05z/app.js
      - name: Publish 05Z
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/threejs-test-05z
          if git diff --cached --quiet; then
            echo 'No output changes to publish.'
          else
            git commit -m 'Build Test 05Z real combat default impact'
            git push
          fi
