name: Build Three.js Test 05A

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-05a-src/**'
      - '.github/workflows/build-threejs-test05a.yml'

permissions:
  contents: write

concurrency:
  group: threejs-test05a-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned build dependencies
        working-directory: labs/threejs-test-05a-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build movement tuning proof
        working-directory: labs/threejs-test-05a-src
        run: npm run build

      - name: Verify production outputs
        run: |
          test -f labs/threejs-test-05a/index.html
          test -f labs/threejs-test-05a/app.js
          test -f labs/threejs-test-05a/assets/Soldier.glb
          test -f labs/threejs-test-05a/sw.js
          test -f labs/threejs-test-05a/build-info.json
          ! grep -Eqi 'cdn\.jsdelivr|unpkg\.com|esm\.sh|raw\.githubusercontent' labs/threejs-test-05a/index.html labs/threejs-test-05a/app.js labs/threejs-test-05a/sw.js

      - name: Publish built proof to main
        run: |
          git config user.name 'raaioperations-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/threejs-test-05a
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Build Three.js Test 05A movement tuning proof'
          git push origin HEAD:main
