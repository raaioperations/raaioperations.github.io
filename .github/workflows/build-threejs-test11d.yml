name: Build Three.js Test 11D

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-11c-src/status.json'
      - 'labs/threejs-test-11c-src/GREENFIELD_BASELINE.json'
      - 'labs/threejs-test-11d-src/**'
      - '.github/workflows/build-threejs-test11d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        working-directory: labs/threejs-test-11d-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Unit tests
        working-directory: labs/threejs-test-11d-src
        run: npm test

      - name: Build 11D
        working-directory: labs/threejs-test-11d-src
        run: npm run build

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Browser production-world smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4176 --directory labs/threejs-test-11d >/tmp/test11d-server.log 2>&1 &
          SERVER_PID=$!
          CHROME='${{ steps.chrome.outputs.chrome-path }}'
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --ignore-gpu-blocklist \
            --enable-webgl \
            --enable-unsafe-swiftshader \
            --use-angle=swiftshader \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            about:blank >/tmp/test11d-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" >/dev/null 2>&1 || true' EXIT

          CDP_ENDPOINT='http://127.0.0.1:9222' \
          TEST_URL='http://127.0.0.1:4176/?smoke=1' \
          node labs/threejs-test-11d-src/browser-smoke.mjs

      - name: Finalize verification
        working-directory: labs/threejs-test-11d-src
        run: npm run finalize -- PASS

      - name: Verify report
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const info=JSON.parse(fs.readFileSync('labs/threejs-test-11d/build-info.json','utf8'));
          const report=JSON.parse(fs.readFileSync('labs/threejs-test-11d/verification-report.json','utf8'));
          if(report.status!=='PASS') throw new Error('11D verification failed');
          if(info.source_gates.request_animation_frame_calls!==1) throw new Error('one-RAF invariant failed');
          if(info.browser_smoke!=='PASS') throw new Error('browser smoke missing');
          if(info.capabilities.active_chunk_count!==9) throw new Error('active chunk count failed');
          console.log({build_id:info.build_id,status:report.status});
          NODE

      - name: Publish Test11D
        run: |
          git config user.name "raaioperations"
          git config user.email "alanhasan87@gmail.com"
          git add labs/threejs-test-11d
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Build Test11D production world systems'
            git push
          fi
