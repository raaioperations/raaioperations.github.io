name: Build Three.js Test 05Y

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-05y-src/**'
      - 'labs/threejs-test-05x/acceptance.json'
      - '.github/workflows/build-threejs-test05y.yml'

permissions:
  contents: write

concurrency:
  group: threejs-test-05y
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: labs/threejs-test-05y-src
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Build 05Y
        working-directory: labs/threejs-test-05y-src
        run: npm run build
      - name: Verify 05Y
        run: |
          test -f labs/threejs-test-05y/index.html
          test -f labs/threejs-test-05y/app.js
          test -f labs/threejs-test-05y/build-info.json
          test -f labs/threejs-test-05y/verification-report.json
          test -f labs/threejs-test-05y/assets/Soldier.glb
          grep -q '05Y — AVERAGE MELEE CONTACT BURST' labs/threejs-test-05y/index.html
          grep -q '"duration_ms": 92' labs/threejs-test-05y/build-info.json
          grep -q '"screen_flash": false' labs/threejs-test-05y/build-info.json
          grep -q '"inherited_feedback_unchanged": true' labs/threejs-test-05y/build-info.json
          grep -q '"accepted_25_40_constants_changed": false' labs/threejs-test-05y/build-info.json
          ! test -f labs/threejs-test-05y/sw.js
      - name: Publish 05Y
        run: |
          git config user.name 'raaioperations-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/threejs-test-05y
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build Test 05Y contact burst'
          git push origin HEAD:main
