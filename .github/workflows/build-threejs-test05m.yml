name: Build Three.js Test 05M

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-05m-src/**'
      - '.github/workflows/build-threejs-test05m.yml'

permissions:
  contents: write

concurrency:
  group: threejs-test05m-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned build dependencies
        working-directory: labs/threejs-test-05m-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build counter damage proof
        working-directory: labs/threejs-test-05m-src
        run: npm run build

      - name: Verify proof outputs
        run: |
          test -f labs/threejs-test-05m/index.html
          test -f labs/threejs-test-05m/app.js
          test -f labs/threejs-test-05m/assets/Soldier.glb
          test -f labs/threejs-test-05m/sw.js
          test -f labs/threejs-test-05m/build-info.json
          ! grep -Eqi 'cdn\.jsdelivr|unpkg\.com|esm\.sh' labs/threejs-test-05m/index.html labs/threejs-test-05m/app.js labs/threejs-test-05m/sw.js
          grep -q 'COUNTER DAMAGE APPLIED' labs/threejs-test-05m/app.js
          grep -q 'COUNTER DAMAGE EXACT' labs/threejs-test-05m/app.js
          grep -q 'COUNTER DAMAGE REPEAT BLOCKED' labs/threejs-test-05m/app.js
          grep -q 'counterDamageCheck5' labs/threejs-test-05m/index.html
          grep -q 'Counter target HP' labs/threejs-test-05m/index.html

      - name: Publish built proof to main
        run: |
          git config user.name 'raaioperations-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/threejs-test-05m
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Build Three.js Test 05M counter damage proof'
          git push origin HEAD:main
