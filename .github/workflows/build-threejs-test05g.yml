name: Build Three.js Test 05G

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-05g-src/**'
      - '.github/workflows/build-threejs-test05g.yml'

permissions:
  contents: write

concurrency:
  group: threejs-test05g-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned build dependencies
        working-directory: labs/threejs-test-05g-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build dodge / evade proof
        working-directory: labs/threejs-test-05g-src
        run: npm run build

      - name: Verify proof outputs
        run: |
          test -f labs/threejs-test-05g/index.html
          test -f labs/threejs-test-05g/app.js
          test -f labs/threejs-test-05g/assets/Soldier.glb
          test -f labs/threejs-test-05g/sw.js
          test -f labs/threejs-test-05g/build-info.json
          ! grep -Eqi 'cdn\.jsdelivr|unpkg\.com|esm\.sh' labs/threejs-test-05g/index.html labs/threejs-test-05g/app.js labs/threejs-test-05g/sw.js
          grep -q 'DODGE INPUT ACCEPTED' labs/threejs-test-05g/app.js
          grep -q 'DODGE REPEAT BLOCKED' labs/threejs-test-05g/app.js
          grep -q 'DODGE DISTANCE CONFIRMED' labs/threejs-test-05g/app.js
          grep -q 'Test 05G checklist' labs/threejs-test-05g/index.html
          grep -q 'dodgeCheck7' labs/threejs-test-05g/index.html

      - name: Publish built proof to main
        run: |
          git config user.name 'raaioperations-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/threejs-test-05g
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Build Three.js Test 05G dodge evade proof'
          git push origin HEAD:main
