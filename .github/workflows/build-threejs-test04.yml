name: Build Three.js Test 04

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-04-src/**'
      - '.github/workflows/build-threejs-test04.yml'

permissions:
  contents: write

concurrency:
  group: threejs-test04-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned build dependencies
        working-directory: labs/threejs-test-04-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build local runtime and assets
        working-directory: labs/threejs-test-04-src
        run: npm run build

      - name: Verify self-hosted runtime outputs
        run: |
          test -f labs/threejs-test-04/index.html
          test -f labs/threejs-test-04/app.js
          test -f labs/threejs-test-04/assets/Soldier.glb
          test -f labs/threejs-test-04/sw.js
          ! grep -Eqi 'cdn\.jsdelivr|unpkg\.com|esm\.sh|raw\.githubusercontent' labs/threejs-test-04/index.html labs/threejs-test-04/app.js labs/threejs-test-04/sw.js

      - name: Publish built proof to main
        run: |
          git config user.name 'raaioperations-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/threejs-test-04
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Build Three.js Test 04 production bundle'
          git push origin HEAD:main
