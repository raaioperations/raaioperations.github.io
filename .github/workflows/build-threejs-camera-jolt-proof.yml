name: Build Three.js Camera Jolt Proof

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-camera-jolt-proof-src/**'
      - '.github/workflows/build-threejs-camera-jolt-proof.yml'

permissions:
  contents: write

concurrency:
  group: threejs-camera-jolt-proof-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned dependencies
        working-directory: labs/threejs-camera-jolt-proof-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build clean camera proof
        working-directory: labs/threejs-camera-jolt-proof-src
        run: npm run build

      - name: Verify proof architecture
        run: |
          test -f labs/threejs-camera-jolt-proof/index.html
          test -f labs/threejs-camera-jolt-proof/app.js
          test -f labs/threejs-camera-jolt-proof/build-info.json
          grep -q 'THREE.JS CAMERA JOLT PROOF' labs/threejs-camera-jolt-proof/index.html
          grep -q 'KeyK' labs/threejs-camera-jolt-proof/build-info.json
          grep -q 'KeyL' labs/threejs-camera-jolt-proof/build-info.json
          grep -q 'source_level_camera_rig' labs/threejs-camera-jolt-proof/build-info.json
          grep -q 'post_bundle_patching' labs/threejs-camera-jolt-proof/build-info.json
          ! grep -Eqi 'cdn\.jsdelivr|unpkg\.com|esm\.sh' labs/threejs-camera-jolt-proof/index.html labs/threejs-camera-jolt-proof/app.js
          test ! -f labs/threejs-camera-jolt-proof/sw.js

      - name: Publish proof
        run: |
          git config user.name 'raaioperations-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/threejs-camera-jolt-proof
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Build clean Three.js camera jolt proof'
          git push origin HEAD:main
