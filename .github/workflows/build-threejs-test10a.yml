name: Build Three.js Test 10A

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-10a-src/**'
      - '.github/workflows/build-threejs-test10a.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        working-directory: labs/threejs-test-10a-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build 10A
        working-directory: labs/threejs-test-10a-src
        run: npm run build

      - name: Verify 10A
        run: |
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('labs/threejs-test-10a/verification-report.json','utf8')); if(v.status!=='PASS'||v.test!=='10A') process.exit(1); console.log(v);"

      - name: Publish 10A
        run: |
          git config user.name "raaioperations"
          git config user.email "alanhasan87@gmail.com"
          git add labs/threejs-test-10a
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build 10A Windcut Shelf replication proof"
            git push
          fi
