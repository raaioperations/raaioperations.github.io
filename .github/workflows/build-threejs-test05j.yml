name: Build Three.js Test 05J

on:
  push:
    branches: [main]
    paths:
      - 'labs/threejs-test-05j-src/**'
      - '.github/workflows/build-threejs-test05j.yml'

permissions:
  contents: write

concurrency:
  group: threejs-test05j-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned build dependencies
        working-directory: labs/threejs-test-05j-src
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build parry timing proof
        working-directory: labs/threejs-test-05j-src
        run: npm run build

      - name: Verify proof outputs
        run: |
          test -f labs/threejs-test-05j/index.html
          test -f labs/threejs-test-05j/app.js
          test -f labs/threejs-test-05j/assets/Soldier.glb
          test -f labs/threejs-test-05j/sw.js
          test -f labs/threejs-test-05j/build-info.json
          ! grep -Eqi 'cdn\.jsdelivr|unpkg\.com|esm\.sh' labs/threejs-test-05j/index.html labs/threejs-test-05j/app.js labs/threejs-test-05j/sw.js
          grep -q 'PARRY WINDOW OPEN' labs/threejs-test-05j/app.js
          grep -q 'PARRY FRONT WINDOW CONFIRMED' labs/threejs-test-05j/app.js
          grep -q 'PARRY WINDOW CLOSE CONFIRMED' labs/threejs-test-05j/app.js
          grep -q 'PARRY REAR BYPASS CONFIRMED' labs/threejs-test-05j/app.js
          grep -q 'Test 05J checklist' labs/threejs-test-05j/index.html
          grep -q 'parryCheck5' labs/threejs-test-05j/index.html

      - name: Publish built proof to main
        run: |
          git config user.name 'raaioperations-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/threejs-test-05j
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Build Three.js Test 05J parry timing proof'
          git push origin HEAD:main
