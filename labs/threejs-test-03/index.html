eStick);stick.addEventListener('pointercancel',freeStick);sprint.addEventListener('pointerdown',e=>{e.preventDefault();touchSprint=true;sprint.style.transform='scale(.94)'});for(const ev of ['pointerup','pointercancel','pointerleave'])sprint.addEventListener(ev,()=>{touchSprint=false;sprint.style.transform='scale(1)'});jump.addEventListener('pointerdown',e=>{e.preventDefault();jumpQueued=true;jump.style.transform='scale(.93)'});for(const ev of ['pointerup','pointercancel','pointerleave'])jump.addEventListener(ev,()=>jump.style.transform='scale(1)');const panel=document.getElementById('panel');document.getElementById('tuneBtn').onclick=()=>panel.classList.toggle('open');const tod=document.getElementById('tod'),fogS=document.getElementById('fog'),dampS=document.getElementById('damp');document.getElementById('shadowBtn').onclick=e=>{renderer.shadowMap.enabled=!renderer.shadowMap.enabled;e.target.textContent='Dynamic shadows: '+(renderer.shadowMap.enabled?'ON':'OFF')};const dayTop=new THREE.Color(0x66b1da),duskTop=new THREE.Color(0x66718c),dayMid=new THREE.Color(0xc7d8d5),duskMid=new THREE.Color(0xc39990),dayBottom=new THREE.Color(0xf0ddbc),duskBottom=new THREE.Color(0xf0a172);function updateEnvironment(){const hour=+tod.value,t=(hour-6)/14,ang=.10+t*Math.PI*.91,elev=Math.max(.04,Math.sin(ang)),az=-1.65+t*1.55;sun.position.set(Math.cos(az)*72,elev*84,Math.sin(az)*72);sun.intensity=.9+elev*3.4;const sd=sun.position.clone().normalize();skyU.sunDir.value.copy(sd);waterU.sunDir.value.copy(sd);const edge=THREE.MathUtils.smoothstep(Math.abs(hour-13),3,7);skyU.top.value.copy(dayTop).lerp(duskTop,edge);skyU.mid.value.copy(dayMid).lerp(duskMid,edge*.8);skyU.bottom.value.copy(dayBottom).lerp(duskBottom,edge);sun.color.setRGB(1,.94-.12*edge,.81-.16*edge);hemi.intensity=.92+elev*1.35;fill.intensity=.18+elev*.20;scene.fog.density=.0025+(+fogS.value)*.009;scene.fog.color.copy(skyU.mid.value).lerp(skyU.bottom.value,.42);renderer.toneMappingExposure=.84+elev*.32;}function resolveObstacles(pos){for(const o of obstacles){const dx=pos.x-o.x,dz=pos.z-o.z,dist=Math.hypot(dx,dz),min=o.r+.38;if(dist<min&&dist>.0001){const push=min-dist;pos.x+=dx/dist*push;pos.z+=dz/dist*push;}}}function zoneName(x,z){if(Math.hypot(x-bx,z-bz)<10)return'OVERLOOK BEACON';if(Math.hypot(x-ruinX,z-ruinZ)<15)return'RUINED OBSERVATORY';if(onBridge(x,z))return'OLD RIVER BRIDGE';if(Math.abs(x-streamCenter(z))<9)return'RIVER VALLEY';if(z<0)return'HIGHLAND TRAIL';return'FOREST EDGE';}function cameraCollision(target,desired){let best=desired.clone();const ray=desired.clone().sub(target),steps=12;for(let i=1;i<=steps;i++){const t=i/steps,p=target.clone().addScaledVector(ray,t);const gh=groundHeight(p.x,p.z)+.65;if(p.y<gh){best=target.clone().addScaledVector(ray,Math.max(.12,(i-1)/steps));break;}for(const o of obstacles){if(Math.hypot(p.x-o.x,p.z-o.z)<o.r+.28&&p.y<groundHeight(o.x,o.z)+7){best=target.clone().addScaledVector(ray,Math.max(.12,(i-1)/steps));return best;}}}return best;}
const clock=new THREE.Clock();let frames=0,acc=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(.033,clock.getDelta()),time=clock.elapsedTime;updateEnvironment();const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),input=new THREE.Vector3();if(keys.KeyW)input.add(fwd);if(keys.KeyS)input.sub(fwd);if(keys.KeyD)input.add(right);if(keys.KeyA)input.sub(right);if(touchMove.lengthSq()>.002){input.addScaledVector(fwd,touchMove.y);input.addScaledVector(right,touchMove.x);}const sprinting=(keys.ShiftLeft||touchSprint)&&input.lengthSq()>.01;const inWater=waterDepthAt(playerRoot.position.x,playerRoot.position.z)&&groundHeight(playerRoot.position.x,playerRoot.position.z)<-1.3;const maxSpeed=(sprinting?8.6:4.7)*(inWater?.55:1);if(input.lengthSq()>0){input.normalize();const targetV=input.multiplyScalar(maxSpeed),blend=1-Math.exp(-(grounded?12:5)*dt);velocity.x=THREE.MathUtils.lerp(velocity.x,targetV.x,blend);velocity.z=THREE.MathUtils.lerp(velocity.z,targetV.z,blend);}else{const d=Math.exp(-(grounded?10:2.5)*dt);velocity.x*=d;velocity.z*=d;}if(jumpQueued&&grounded){verticalVel=7.6;grounded=false;}jumpQueued=false;verticalVel+=-18.5*dt;playerRoot.position.x+=velocity.x*dt;playerRoot.position.z+=velocity.z*dt;playerRoot.position.x=THREE.MathUtils.clamp(playerRoot.position.x,-104,104);playerRoot.position.z=THREE.MathUtils.clamp(playerRoot.position.z,-104,104);resolveObstacles(playerRoot.position);const gh=groundHeight(playerRoot.position.x,playerRoot.position.z);playerRoot.position.y+=verticalVel*dt;if(playerRoot.position.y<=gh){playerRoot.position.y=gh;if(verticalVel<0)verticalVel=0;grounded=true;}else grounded=false;const speed=Math.hypot(velocity.x,velocity.z);if(speed>.2){const targetYaw=Math.atan2(velocity.x,velocity.z);let d=((targetYaw-playerRoot.rotation.y+Math.PI)%(Math.PI*2))-Math.PI;playerRoot.rotation.y+=d*(1-Math.exp(-14*dt));}if(modelReady&&grounded){if(speed<.25)setAction(actions.Idle?
