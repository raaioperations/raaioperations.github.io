<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAAI Test 09C — Sunlit Basin Production Asset Kit</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{display:block}
#panel{position:fixed;left:14px;top:14px;width:min(420px,calc(100vw - 28px));padding:13px 14px;border:1px solid #ffffff2c;border-radius:14px;background:#091012c9;backdrop-filter:blur(12px);z-index:3;box-shadow:0 12px 30px #0005}
.kicker{font-weight:850;font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.row{display:flex;justify-content:space-between;gap:14px;margin-top:8px;font-size:12px}
#assetName{font-weight:800;font-size:19px;margin-top:6px}
.small{font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d8e3df}
.pass{color:#a8f0b5}.amber{color:#ffe59a}.fail{color:#ff9b9b}
#controls{display:flex;gap:7px;margin-top:10px}
button{border:1px solid #ffffff2b;background:#ffffff10;color:#fff;border-radius:9px;padding:7px 9px;cursor:pointer}
button:hover,button.active{background:#ffffff25}
#assetList{position:fixed;right:14px;top:14px;width:235px;max-height:calc(100vh - 28px);overflow:auto;padding:10px;border:1px solid #ffffff2c;border-radius:14px;background:#091012c9;backdrop-filter:blur(12px);z-index:3;display:flex;flex-direction:column;gap:5px}
#assetList button{text-align:left;font-size:10px}
#footer{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:#091012b8;font-size:11px;z-index:3;white-space:nowrap}
@media(max-width:760px){#assetList{display:none}#panel{width:calc(100vw - 28px)}#footer{font-size:9px}}
</style>
</head>
<body>
<div id="panel">
  <div class="kicker">09C — Sunlit Basin Production Asset Kit</div>
  <div class="row"><span>Asset</span><b id="assetCount">—</b></div>
  <div id="assetName">Loading…</div>
  <div id="assetStats" class="small">—</div>
  <div id="assetMaterials" class="small">—</div>
  <div class="row"><span>Format</span><b>Standalone GLB</b></div>
  <div class="row"><span>Review</span><b id="status" class="amber">LOADING</b></div>
  <div id="controls">
    <button id="prev">← PREV</button>
    <button id="next">NEXT →</button>
    <button id="spin">AUTO ROTATE: ON</button>
  </div>
</div>
<div id="assetList"></div>
<div id="footer">Original reusable assets · Orbit/zoom with mouse · ← / → changes asset</div>
<script type="module" src="./app.js"></script>
</body>
</html>
