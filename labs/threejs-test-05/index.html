<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101719">
<title>RAAI Three.js Test 05 — Combat Feel + Reactive World</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101719;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}#boot{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:linear-gradient(#101719,#182225);color:#eef6f4;font:650 14px/1.5 system-ui;letter-spacing:.04em;transition:opacity .25s}#boot.hide{opacity:0;pointer-events:none}#hud{position:fixed;inset:0;z-index:5;pointer-events:none;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}#metrics{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));padding:8px 10px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(8,13,16,.40);backdrop-filter:blur(10px);min-width:174px}#metrics .title{font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}#stats{display:grid;grid-template-columns:auto auto;gap:1px 14px;font:9px/1.38 ui-monospace,SFMono-Regular,Menlo,monospace}#stats b{text-align:right}#zone{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(8,13,16,.34);backdrop-filter:blur(8px);font-size:9px;font-weight:800;letter-spacing:.07em;white-space:nowrap}#tuneBtn{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:62px;height:38px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(8,13,16,.45);backdrop-filter:blur(10px);color:#fff;font-weight:800;letter-spacing:.04em;pointer-events:auto}#panel{position:absolute;right:max(12px,env(safe-area-inset-right));top:58px;width:min(250px,calc(100vw - 24px));padding:12px 13px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(8,13,16,.78);backdrop-filter:blur(14px);pointer-events:auto;transform:translateY(-8px);opacity:0;visibility:hidden;transition:.18s ease}#panel.open{transform:none;opacity:1;visibility:visible}#panel .title{font-size:12px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}#panel label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;margin:8px 0}#panel input[type=range]{width:135px}#panel button{width:100%;margin-top:6px;padding:8px 10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:9px}#mobile{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}#stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,calc(env(safe-area-inset-bottom) + 12px));width:110px;height:110px;border-radius:50%;border:1px solid rgba(255,255,255,.24);background:rgba(8,13,16,.18);backdrop-filter:blur(8px);pointer-events:auto;touch-action:none}#knob{position:absolute;left:36px;top:36px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.62);box-shadow:0 4px 16px rgba(0,0,0,.28)}.action{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(8,13,16,.28);backdrop-filter:blur(8px);color:#fff;font-weight:850;letter-spacing:.04em;pointer-events:auto;touch-action:none}#sprint{right:max(22px,env(safe-area-inset-right));bottom:max(26px,calc(env(safe-area-inset-bottom) + 15px));width:78px;height:78px}#jump{right:max(104px,calc(env(safe-area-inset-right) + 88px));bottom:max(44px,calc(env(safe-area-inset-bottom) + 34px));width:62px;height:62px;font-size:11px}#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:rgba(8,13,16,.42);font-size:9px;opacity:0;transition:.2s}#toast.show{opacity:1}#error{display:none;position:fixed;inset:0;z-index:40;background:#0d1012;color:#fff;padding:26px;font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap}@media(pointer:coarse),(max-width:900px){#mobile{display:block}#metrics{min-width:154px;padding:7px 8px}#metrics .title{font-size:9px}#stats{font-size:8.5px}#zone{font-size:8.5px;top:12px}#panel{top:56px}}

#combatHud{position:absolute;left:50%;top:45px;transform:translateX(-50%);width:210px;padding:7px 9px;border-radius:11px;background:rgba(8,13,16,.30);backdrop-filter:blur(8px);font:800 8px/1 system-ui;letter-spacing:.05em}.combatLine{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:6px;margin:4px 0}.combatLine b{text-align:right;font:800 8px ui-monospace,monospace}.bar{height:5px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden}.bar i{display:block;width:100%;height:100%;background:#b9e5c2;transition:width .12s}.bar.enemy i{background:#f08772}.primary{font-size:11px!important}#attack{right:max(18px,env(safe-area-inset-right));bottom:max(20px,calc(env(safe-area-inset-bottom) + 10px));width:82px;height:82px}#dodge{right:max(106px,calc(env(safe-area-inset-right) + 90px));bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));width:64px;height:64px;font-size:9px}#block{right:max(176px,calc(env(safe-area-inset-right) + 160px));bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));width:60px;height:60px;font-size:9px}#lock{right:max(112px,calc(env(safe-area-inset-right) + 96px));bottom:max(101px,calc(env(safe-area-inset-bottom) + 91px));width:54px;height:54px;font-size:8px}#jump{right:max(22px,env(safe-area-inset-right));bottom:max(111px,calc(env(safe-area-inset-bottom) + 101px));width:56px;height:56px;font-size:8px}#sprint{right:max(174px,calc(env(safe-area-inset-right) + 158px));bottom:max(96px,calc(env(safe-area-inset-bottom) + 86px));width:56px;height:56px;font-size:8px}@media(pointer:coarse),(max-width:900px){#combatHud{top:41px;width:180px;padding:5px 7px}.combatLine{grid-template-columns:30px 1fr 24px;gap:5px;margin:3px 0}}
</style>
</head>
<body>
<div id="boot">Starting combat production bundle…</div>
<div id="hud"><div id="metrics"><div class="title">RAAI Proof 05 — Combat + Reactive World</div><div id="stats"><span>FPS</span><b id="fps">—</b><span>Draw calls</span><b id="calls">—</b><span>Triangles</span><b id="tris">—</b><span>Character</span><b id="char">BOOT</b><span>Render scale</span><b id="scale">—</b><span>Combat</span><b id="combatState">READY</b></div></div><div id="zone">FOREST APPROACH</div><div id="combatHud"><div class="combatLine"><span>YOU</span><div class="bar"><i id="playerBar"></i></div><b id="playerHp">100</b></div><div class="combatLine"><span>RIVAL</span><div class="bar enemy"><i id="enemyBar"></i></div><b id="enemyHp">100</b></div></div><button id="tuneBtn">TUNE</button><div id="panel"><div class="title">Live variables</div><label><span>Time</span><input id="tod" type="range" min="6" max="20" step="0.1" value="9.8"></label><label><span>Atmosphere</span><input id="fog" type="range" min="0" max="1" step="0.01" value="0.34"></label><label><span>Wind</span><input id="wind" type="range" min="0" max="1" step="0.01" value="0.48"></label><label><span>Camera</span><input id="damp" type="range" min="0.05" max="0.22" step="0.005" value="0.12"></label><button id="shadowBtn">Dynamic shadows: ON</button></div><div id="toast"></div></div>
<div id="mobile"><div id="stick"><div id="knob"></div></div><button id="attack" class="action primary">ATTACK</button><button id="dodge" class="action">DODGE</button><button id="block" class="action">BLOCK</button><button id="lock" class="action small">LOCK</button><button id="jump" class="action small">JUMP</button><button id="sprint" class="action small">SPRINT</button></div>
<div id="error"></div>
