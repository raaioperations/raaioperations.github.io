#panel .title{font-size:12px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}

#mobile{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,calc(env(safe-area-inset-bottom) + 12px));width:112px;height:112px;border-radius:50%;border:1px solid rgba(255,255,255,.24);background:rgba(8,13,16,.20);backdrop-filter:blur(8px);pointer-events:auto;touch-action:none}

const dayTop=new THREE.Color(0x68b7df),duskTop=new THREE.Color(0x66718f),dayMid=new THREE.Color(0xc5d7d4),duskMid=new THREE.Color(0xc3978d),dayBottom=new THREE.Color(0xf2dfbe),duskBottom=new THREE.Color(0xf0a173);function updateEnvironment(){const hour=+tod.value,t=(hour-6)/14,ang=.10+t*Math.PI*.91,elev=Math.max(.04,Math.sin(ang)),az=-1.65+t*1.55;sun.position.set(Math.cos(az)*72,elev*83,Math.sin(az)*72);sun.intensity=.85+elev*3.45;const sd=sun.position.clone().normalize();skyUniforms.sunDir.value.copy(sd);waterUniforms.sunDir.value.copy(sd);const edge=THREE.MathUtils.smoothstep(Math.abs(hour-13),3,7);skyUniforms.top.value.copy(dayTop).lerp(duskTop,edge);skyUniforms.mid.value.copy(dayMid).lerp(duskMid,edge*.8);skyUniforms.bottom.value.copy(dayBottom).lerp(duskBottom,edge);sun.color.setRGB(1,.93-.12*edge,.79-.16*edge);hemi.intensity=.92+elev*1.45;fill.intensity=.20+elev*.22;scene.fog.density=.0028+(+fogS.value)*.0095;scene.fog.color.copy(skyUniforms.mid.value).lerp(skyUniforms.bottom.value,.42);renderer.toneMappingExposure=.82+elev*.34;}
const vel=new THREE.Vector3(),move=new THREE.Vector3(),clock=new THREE.Clock();let frames=0,acc=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(.033,clock.getDelta()),time=clock.elapsedTime;updateEnvironment();const fwd=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));move.set(0,0,0);if(keys.KeyW)move.add(fwd);if(keys.KeyS)move.sub(fwd);if(keys.KeyD)move.add(right);if(keys.KeyA)move.sub(right);if(touchMove.lengthSq()>.002){move.addScaledVector(fwd,touchMove.y);move.addScaledVector(right,touchMove.x);}if(move.lengthSq()>0){move.normalize();const speed=(keys.ShiftLeft||touchSprint)?9:5;vel.lerp(move.multiplyScalar(speed),1-Math.exp(-11*dt));player.rotation.y=Math.atan2(vel.x,vel.z)+Math.PI;}else vel.multiplyScalar(Math.exp(-9*dt));player.position.addScaledVector(vel,dt);player.position.x=THREE.MathUtils.clamp(player.position.x,-88,88);player.position.z=THREE.MathUtils.clamp(player.position.z,-88,88);player.position.y=heightAt(player.position.x,player.position.z)+.05;const mv=Math.min(1,vel.length()/4.5),step=time*(vel.length()>6?12.5:9.2);arms[0].rotation.x=Math.sin(step)*.68*mv;arms[1].rotation.x=-Math.sin(step)*.68*mv;legs[0].rotation.x=-Math.sin(step)*.78*mv;legs[1].rotation.x=Math.sin(step)*.78*mv;torso.position.y=1.32+Math.abs(Math.sin(step*2))*.035*mv;head.position.y=2.22+Math.abs(Math.sin(step*2))*.022*mv;cape.rotation.x=-.10-.08*mv+Math.sin(time*4.2)*.018*(.3+mv);const target=player.position.clone().add(new THREE.Vector3(0,1.48,0));let desired=target.clone().add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch)*camDist,Math.sin(pitch)*camDist+1.05,Math.cos(yaw)*Math.cos(pitch)*camDist));const ground=heightAt(desired.x,desired.z)+.72;if(desired.y<ground)desired.y=ground;const ck=1-Math.pow(1-(+dampS.value),dt*60);camera.position.lerp(desired,ck);camera.lookAt(target);sun.target.position.copy(player.position);sun.target.updateMatrixWorld();waterUniforms.time.value=time;const w=motion?+windS.value:0;for(const mat of [leafMatA,leafMatB,grassMat,flowerMat])if(mat.userData.shader){mat.userData.shader.uniforms.uTime.value=time;mat.userData.shader.uniforms.uWind.value=w;}if(motion){motes.rotation.y=time*.014;const a=motes.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)+Math.sin(time*.55+i*.91)*.0006;if(y>12)y=.8;a.setY(i,y);}a.needsUpdate=true;}renderer.render(scene,camera);frames++;acc+=dt;if(acc>.55){document.getElementById('fps').textContent=Math.round(frames/acc);frames=0;acc=0;document.getElementById('calls').textContent=renderer.info.render.calls;document.getElementById('tris').textContent=renderer.info.render.triangles.toLocaleString();}}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,IS_COARSE?1.45:1.8));renderer.setSize(innerWidth,innerHeight)});
